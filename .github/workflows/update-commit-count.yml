name: Update commit count

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"

permissions:
  contents: write

concurrency:
  group: update-commit-count
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-commit-count:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Count commits across selected repositories
        env:
          GH_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
        run: |
          set -e

          mkdir -p /tmp/repos
          cd /tmp/repos

          TOTAL=0

          repos=$(gh api --paginate "/user/repos?per_page=100&affiliation=owner,collaborator,organization_member" \
            --jq '.[] | .full_name')

          echo "Repositories found:"
          echo "$repos"
          echo "----------------------------------------"

          should_skip_repo() {
            repo="$1"

            case "$repo" in
              *github-readme-stats*)
                return 0
                ;;
              laplateformeio/mediatheque_toulouse_grp1)
                return 0
                ;;
              laplateformeio/mediatheque_toulouse_grp2)
                return 0
                ;;
              laplateformeio/mediatheque_toulouse_grp3)
                return 0
                ;;
              laplateformeio/mediatheque_toulouse_grp4)
                return 0
                ;;
              laplateformeio/mediatheque_toulouse_grp5)
                return 0
                ;;
              laplateformeio/mediatheque_toulouse_grp6)
                return 0
                ;;
              laplateformeio/mediatheque_toulouse_grp7)
                return 0
                ;;
              *)
                return 1
                ;;
            esac
          }

          for repo in $repos; do
            echo "Repo detected: [$repo]"

            if should_skip_repo "$repo"; then
              echo "Skipping excluded repo: $repo"
              echo "----------------------------------------"
              continue
            fi

            echo "Checking $repo"

            folder=$(echo "$repo" | tr '/' '_')

            if git clone --quiet "https://x-access-token:${GH_TOKEN}@github.com/${repo}.git" "$folder"; then
              cd "$folder"

              git fetch --all --quiet --tags

              count=$(git rev-list --all --count)

              echo "$repo: $count commits"

              TOTAL=$((TOTAL + count))

              cd ..
            else
              echo "Could not clone $repo"
            fi

            echo "----------------------------------------"
          done

          echo "TOTAL_COMMITS=$TOTAL"
          echo "TOTAL_COMMITS=$TOTAL" >> "$GITHUB_ENV"

      - name: Update README
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          total = os.environ.get("TOTAL_COMMITS", "0")

          readme_path = Path("README.md")
          content = readme_path.read_text(encoding="utf-8")

          start = "<!-- COMMIT-COUNT:START -->"
          end = "<!-- COMMIT-COUNT:END -->"

          if start not in content or end not in content:
              raise SystemExit("Commit count markers not found in README.md")

          new_block = (
              f"{start}\n"
              f"![Commits](https://img.shields.io/badge/Commits-{total}-blue?style=for-the-badge&logo=github)\n"
              f"{end}"
          )

          before = content.split(start)[0]
          after = content.split(end)[1]

          readme_path.write_text(before + new_block + after, encoding="utf-8")
          PY

      - name: Commit README update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update commit count"
            git pull --rebase origin main
            git push
          fi
